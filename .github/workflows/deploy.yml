name: Deploy Cloudflare

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # 模板默认不发布；完成站点资源和密钥配置后再开启。
    if: >-
      ${{ vars.CLOUDFLARE_AUTO_DEPLOY == 'true' &&
          ((github.event_name == 'workflow_run' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_repository.full_name == github.repository) ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      DEPLOY_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.DEPLOY_SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check deployment credentials
        shell: pwsh
        run: |
          if (-not $env:CLOUDFLARE_API_TOKEN -or -not $env:CLOUDFLARE_ACCOUNT_ID) {
            throw 'Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production environment.'
          }
      - run: npm ci
      - run: npm run typecheck
      # 配置错误时必须在修改远端数据库之前终止。
      - run: npm run doctor -- --offline
      - run: npm run db:migrate:remote
      - run: npm run deploy
      - name: Record deployed source
        shell: pwsh
        run: |
          "Source: $env:DEPLOY_SOURCE_SHA" >> $env:GITHUB_STEP_SUMMARY
