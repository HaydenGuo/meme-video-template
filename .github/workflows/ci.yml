name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 工作流不需要 git push：checkout 后不保留 GITHUB_TOKEN，npm 依赖的安装脚本和测试代码就拿不到它
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 本地 Worker 只需要 SESSION_SECRET；支付、视频、审核都走 mock
      - name: Create .dev.vars
        run: |
          cp .dev.vars.example .dev.vars
          sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .dev.vars
          # 派生站会改写 ADMIN_EMAILS；测试环境固定使用用例中的管理员身份。
          printf '\nADMIN_EMAILS=admin@example.com\n' >> .dev.vars
          # 发布配置可以是正式服务商或展示模式；本地用例始终使用隔离的开发环境。
          printf '\nSHOWCASE_MODE=false\nAPP_ENV=development\nSITE_URL=http://127.0.0.1:3000\nPAYMENT_PROVIDER=mock\nVIDEO_PROVIDER=mock\nMODERATION_PROVIDER=mock\n' >> .dev.vars
          printf '\nEMAIL_FROM=noreply@example.com\n' >> .dev.vars
      - run: npm run seed:local
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: .tmp/video-template-e2e/
          retention-days: 14
